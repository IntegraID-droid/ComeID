<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="960" viewBox="0 0 780 960" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#17326f"/>
    </marker>
  </defs>

  <!-- 1. Inicio -->
  <ellipse cx="390" cy="45" rx="65" ry="26" fill="#f0f4ff" stroke="#17326f" stroke-width="2"/>
  <text x="390" y="50" text-anchor="middle" fill="#17326f" font-weight="bold">Inicio</text>
  <line x1="390" y1="71" x2="390" y2="98" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 2. Abrir la plataforma -->
  <rect x="300" y="100" width="180" height="52" rx="6" fill="#ffffff" stroke="#17326f" stroke-width="2"/>
  <text x="390" y="123" text-anchor="middle" fill="#1a1a1a">El usuario abre</text>
  <text x="390" y="140" text-anchor="middle" fill="#1a1a1a">la plataforma</text>
  <line x1="390" y1="152" x2="390" y2="182" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 3. ¿Tiene cuenta? -->
  <polygon points="390,184 480,232 390,280 300,232" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
  <text x="390" y="228" text-anchor="middle" fill="#7a4d00">¿Tiene cuenta</text>
  <text x="390" y="245" text-anchor="middle" fill="#7a4d00">registrada?</text>

  <!-- Rama NO -->
  <line x1="300" y1="232" x2="210" y2="232" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="252" y="222" text-anchor="middle" fill="#c0392b" font-size="12">No</text>
  <rect x="60" y="207" width="148" height="50" rx="6" fill="#fdefe6" stroke="#c0392b" stroke-width="1.6"/>
  <text x="134" y="228" text-anchor="middle" fill="#7a2c1a">Registrarse o</text>
  <text x="134" y="245" text-anchor="middle" fill="#7a2c1a">pedir ayuda</text>
  <line x1="134" y1="257" x2="134" y2="290" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="134" y1="290" x2="390" y2="290" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="390" y1="290" x2="390" y2="332" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Rama SI continua -->
  <line x1="390" y1="280" x2="390" y2="332" stroke="#1e7e34" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="404" y="308" text-anchor="start" fill="#1e7e34" font-size="12">Sí</text>

  <!-- 4. Iniciar sesión -->
  <rect x="290" y="334" width="200" height="52" rx="6" fill="#ffffff" stroke="#17326f" stroke-width="2"/>
  <text x="390" y="357" text-anchor="middle" fill="#1a1a1a">Iniciar sesión</text>
  <text x="390" y="374" text-anchor="middle" fill="#1a1a1a">(correo y contraseña)</text>
  <line x1="390" y1="386" x2="390" y2="416" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 5. ¿Datos válidos? -->
  <polygon points="390,418 480,466 390,514 300,466" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
  <text x="390" y="462" text-anchor="middle" fill="#7a4d00">¿Correo y claves</text>
  <text x="390" y="479" text-anchor="middle" fill="#7a4d00">válidos?</text>

  <!-- Rama NO -->
  <line x1="300" y1="466" x2="210" y2="466" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="252" y="456" text-anchor="middle" fill="#c0392b" font-size="12">No</text>
  <rect x="60" y="441" width="148" height="50" rx="6" fill="#fdefe6" stroke="#c0392b" stroke-width="1.6"/>
  <text x="134" y="462" text-anchor="middle" fill="#7a2c1a">Mostrar error</text>
  <text x="134" y="479" text-anchor="middle" fill="#7a2c1a">e intentar de nuevo</text>
  <line x1="134" y1="491" x2="134" y2="524" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="134" y1="524" x2="390" y2="524" stroke="#c0392b" stroke-width="1.6"/>
  <line x1="390" y1="524" x2="390" y2="566" stroke="#c0392b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- Rama SI -->
  <line x1="390" y1="514" x2="390" y2="566" stroke="#1e7e34" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="404" y="542" text-anchor="start" fill="#1e7e34" font-size="12">Sí</text>

  <!-- 6. Determinar rol -->
  <rect x="270" y="568" width="240" height="52" rx="6" fill="#ffffff" stroke="#17326f" stroke-width="2"/>
  <text x="390" y="591" text-anchor="middle" fill="#1a1a1a">Determinar rol del</text>
  <text x="390" y="608" text-anchor="middle" fill="#1a1a1a">usuario (base de datos)</text>
  <line x1="390" y1="620" x2="390" y2="650" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 7. ¿Qué rol? -->
  <polygon points="390,652 500,700 390,748 280,700" fill="#fff7e6" stroke="#b7791f" stroke-width="2"/>
  <text x="390" y="696" text-anchor="middle" fill="#7a4d00">¿Qué rol tiene</text>
  <text x="390" y="713" text-anchor="middle" fill="#7a4d00">el usuario?</text>

  <!-- Rama 1: admin / profesor -->
  <line x1="300" y1="712" x2="150" y2="775" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="235" y="735" text-anchor="middle" fill="#17326f" font-size="12">Admin / Profesor</text>
  <rect x="20" y="777" width="260" height="70" rx="6" fill="#eef4ff" stroke="#17326f" stroke-width="1.6"/>
  <text x="150" y="798" text-anchor="middle" fill="#17326f" font-weight="bold">Panel de Administración</text>
  <text x="150" y="815" text-anchor="middle" fill="#1a1a1a">Estudiantes, asistencia QR,</text>
  <text x="150" y="832" text-anchor="middle" fill="#1a1a1a">menú, invitados, reportes</text>

  <!-- Rama 2: bibliotecario -->
  <line x1="390" y1="748" x2="390" y2="775" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="404" y="766" text-anchor="start" fill="#17326f" font-size="12">Bibliotecario</text>
  <rect x="250" y="777" width="280" height="70" rx="6" fill="#eef4ff" stroke="#17326f" stroke-width="1.6"/>
  <text x="390" y="798" text-anchor="middle" fill="#17326f" font-weight="bold">Bibliogest (Biblioteca)</text>
  <text x="390" y="815" text-anchor="middle" fill="#1a1a1a">Catálogo, socios, préstamos,</text>
  <text x="390" y="832" text-anchor="middle" fill="#1a1a1a">reservas, devoluciones</text>

  <!-- Rama 3: estudiante -->
  <line x1="480" y1="712" x2="625" y2="775" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="545" y="735" text-anchor="middle" fill="#17326f" font-size="12">Estudiante</text>
  <rect x="495" y="777" width="265" height="70" rx="6" fill="#eef4ff" stroke="#17326f" stroke-width="1.6"/>
  <text x="627" y="798" text-anchor="middle" fill="#17326f" font-weight="bold">Portal de Estudiantes</text>
  <text x="627" y="815" text-anchor="middle" fill="#1a1a1a">Menú, asistencia, biblioteca,</text>
  <text x="627" y="832" text-anchor="middle" fill="#1a1a1a">notificaciones, QR</text>

  <!-- Flechas hacia Fin -->
  <line x1="150" y1="847" x2="150" y2="886" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="390" y1="847" x2="390" y2="886" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="627" y1="847" x2="627" y2="886" stroke="#17326f" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- 8. Fin -->
  <ellipse cx="390" cy="915" rx="65" ry="26" fill="#fdeef0" stroke="#c0392b" stroke-width="2"/>
  <text x="390" y="920" text-anchor="middle" fill="#8a1c1c" font-weight="bold">Fin</text>

  <!-- Leyenda de símbolos -->
  <g transform="translate(620,120)">
    <rect x="0" y="0" width="150" height="150" rx="6" fill="#f7f8fa" stroke="#c4cbd8" stroke-width="1"/>
    <text x="75" y="18" text-anchor="middle" fill="#17326f" font-size="12" font-weight="bold">Símbolos</text>
    <ellipse cx="24" cy="42" rx="22" ry="11" fill="#f0f4ff" stroke="#17326f" stroke-width="1.4"/>
    <text x="56" y="46" fill="#333" font-size="11">Inicio / Fin</text>
    <rect x="2" y="68" width="44" height="22" rx="4" fill="#fff" stroke="#17326f" stroke-width="1.4"/>
    <text x="56" y="84" fill="#333" font-size="11">Proceso</text>
    <polygon points="24,104 42,118 24,132 6,118" fill="#fff7e6" stroke="#b7791f" stroke-width="1.4"/>
    <text x="56" y="123" fill="#333" font-size="11">Decisión</text>
  </g>
</svg>