<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integra ID Estudiantes - Iniciar sesión</title>
    <meta name="theme-color" content="#2b67ff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Integra ID Est.">
    <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icons/icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="login-card">
        <img src="assets/logo.png" class="login-logo-img" alt="Integra ID">
        <div class="login-brand">Integra ID <span class="brand-acc">Estudiantes</span></div>
        <p class="login-subtitle">Portal del estudiante · CTP de Liberia</p>

        <div class="form-group">
            <label for="loginEmail">Correo electrónico</label>
            <input type="email" id="loginEmail" placeholder="tu.correo@ctpliberia.ed.cr" autocomplete="email">
        </div>
        <div class="form-group">
            <label for="loginPassword">Contraseña</label>
            <div class="pass-input">
                <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
                <button type="button" class="pass-toggle" onclick="mostrarOcultarClave('loginPassword', this)" tabindex="-1" aria-label="Mostrar contraseña"><i class="fa-solid fa-eye"></i></button>
            </div>
        </div>

        <div class="form-row">
            <label class="check">
                <input type="checkbox" id="recordarme" checked> Recordarme
            </label>
            <button type="button" class="link-btn" onclick="toggleRecuperar()">¿Olvidaste tu contraseña?</button>
        </div>

        <button class="login-btn" id="btnIniciarSesion" onclick="iniciarSesionPortal()">
            <i class="fa-solid fa-right-to-bracket"></i> Iniciar sesión
        </button>

        <p style="text-align:center; margin-top:14px; font-size:13px; color:var(--text-secondary);">
            ¿No tienes cuenta?
            <a href="registro.html" class="link-btn" style="font-size:13px;">Regístrate aquí</a>
        </p>

        <div class="recuperar-box" id="recuperarBox">
            <div class="form-group">
                <label for="loginEmail">Escribe tu correo y te enviamos un enlace para restablecer la contraseña.</label>
            </div>
            <button class="login-btn" style="background:#17326f;" onclick="recuperarContraseña()">
                <i class="fa-solid fa-envelope"></i> Enviar enlace
            </button>
        </div>

        <div id="loginError" class="login-error"></div>

        <div class="login-info">
            <i class="fa-solid fa-shield-halved"></i> Tus datos están protegidos. Solo puedes ver tu propia información.
        </div>
    </div>

    <div class="loading" id="loading"><div class="spinner"></div></div>

    <div class="footer">Integra ID | CTP de Liberia</div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js").catch(() => {});
        }
        // Si ya hay una sesión de estudiante activa, ir directo al portal
        firebase.auth().onAuthStateChanged(user => {
            if (!user) return;
            db.collection("usuarios").doc(user.uid).get().then(doc => {
                if (doc.exists && String(doc.data().rol || "").toLowerCase() === "estudiante") {
                    window.location.href = "dashboard.html";
                } else {
                    firebase.auth().signOut().catch(() => {});
                }
            }).catch(() => {});
        });

        function toggleRecuperar() {
            const box = document.getElementById("recuperarBox");
            const btn = document.getElementById("btnIniciarSesion");
            if (box.classList.contains("show")) {
                box.classList.remove("show");
                btn.style.display = "";
            } else {
                box.classList.add("show");
                btn.style.display = "none";
                ocultarErrorLogin();
            }
        }

        function mostrarOcultarClave(id, btn) {
            const input = document.getElementById(id);
            if (!input) return;
            const mostrar = input.type === "password";
            input.type = mostrar ? "text" : "password";
            const icon = btn.querySelector("i");
            if (icon) icon.className = mostrar ? "fa-solid fa-eye-slash" : "fa-solid fa-eye";
            btn.setAttribute("aria-label", mostrar ? "Ocultar contraseña" : "Mostrar contraseña");
        }

        document.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                if (document.getElementById("recuperarBox").classList.contains("show")) {
                    recuperarContraseña();
                } else {
                    iniciarSesionPortal();
                }
            }
        });
    </script>
</body>

</html>
